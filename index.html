
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bouncy Arena</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#101522;
  color:white;
  font-family:Arial,sans-serif;
}
header{
  padding:20px 7%;
  border-bottom:1px solid #293449;
}
.logo{font-size:23px;font-weight:900}
.logo span,h1 span{color:#55e5a0}
main{max-width:1050px;margin:45px auto;padding:20px}
.hero{text-align:center;margin-bottom:30px}
.tag{
  color:#65e5a8;
  background:#193d35;
  padding:8px 13px;
  border-radius:20px;
}
h1{font-size:clamp(38px,7vw,65px)}
.subtitle,.status{color:#aebbd0}
.layout{
  display:grid;
  grid-template-columns:1.4fr 1fr;
  gap:20px;
}
.panel{
  background:#1b2638;
  border:1px solid #2b3a50;
  border-radius:17px;
  padding:22px;
}
canvas{
  width:100%;
  background:#b9e8ff;
  border-radius:12px;
  display:block;
}
button,input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:0;
  border-radius:9px;
  font-size:15px;
}
button{
  background:#55e5a0;
  color:#102018;
  font-weight:bold;
  cursor:pointer;
}
.secondary{background:#34445d;color:white}
input{
  background:#101522;
  color:white;
  border:1px solid #40516a;
}
#roomCode{
  font-size:25px;
  color:#55e5a0;
  letter-spacing:3px;
}
@media(max-width:750px){
  .layout{grid-template-columns:1fr}
}
</style>
</head>

<body>
<header>
  <div class="logo">BOUNCY<span>ARENA</span></div>
</header>

<main>
<section class="hero">
  <span class="tag">WELCOME TO THE ARENA</span>
  <h1>ENTER THE <span>ARENA.</span></h1>
  <p class="subtitle">Jump in, master the physics, and compete with friends.</p>
</section>

<div class="layout">
<section class="panel">
  <h2>🏟️ Arena</h2>
  <canvas id="game" width="700" height="400"></canvas>
  <p class="status">A/D or arrows to move. W, Space, or Up to jump.</p>
  <button id="play">PLAY / RESUME</button>
  <button class="secondary" id="exit">EXIT ROOM</button>
</section>

<section class="panel">
  <h2>Multiplayer</h2>
  <p class="status" id="status">Connecting to Firebase...</p>
  <button id="create">＋ CREATE ROOM</button>
  <p class="status">Your room code:</p>
  <div id="roomCode">------</div>
  <p class="status">Share this code with friends.</p>
  <input id="joinCode" maxlength="6" placeholder="ENTER ROOM CODE">
  <button class="secondary" id="join">JOIN ROOM</button>
  <p class="status" id="players">Players: 0</p>
</section>
</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA7mmK1Ljk2As5dPCfNAvt9CvF17G6maOE",
  authDomain: "bouncyballarena-70cf9.firebaseapp.com",
  databaseURL: "https://bouncyballarena-70cf9-default-rtdb.firebaseio.com",
  projectId: "bouncyballarena-70cf9",
  storageBucket: "bouncyballarena-70cf9.firebasestorage.app",
  messagingSenderId: "1007913424936",
  appId: "1:1007913424936:web:8ed5bde9eb78692834bd1d",
  measurementId: "G-9Y8FXKXEK6"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const auth = firebase.auth();

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const statusEl = document.getElementById("status");
const codeEl = document.getElementById("roomCode");
const playersEl = document.getElementById("players");

let uid = null;
let room = null;
let playerRef = null;
let players = {};
let running = false;
let keys = {};
let lastSent = 0;
let grounded = false;
let jumpHeld = false;
let lastHits = {};

const radius = 18;

const me = {
  x:100,
  y:332,
  vx:0,
  vy:0
};

const platforms = [
  {x:170,y:270,w:140,h:12},
  {x:420,y:220,w:140,h:12}
];

auth.signInAnonymously()
.then(result=>{
  uid = result.user.uid;
  statusEl.textContent = "Connected! Create a room or join one.";
})
.catch(error=>{
  statusEl.textContent = "Sign-in error: " + error.message;
});

function newCode(){
  return Math.random().toString(36).substring(2,8).toUpperCase();
}

async function createRoom(){
  if(!uid){
    statusEl.textContent = "Still connecting...";
    return;
  }

  const code = newCode();
  const ref = db.ref("rooms/" + code);

  try{
    await ref.set({
      host:uid,
      createdAt:firebase.database.ServerValue.TIMESTAMP,
      players:{
        [uid]:{
          x:100,
          y:332,
          name:"Player",
          updatedAt:Date.now()
        }
      }
    });

    await enterRoom(code);
  }catch(error){
    statusEl.textContent = "Create failed: " + error.message;
  }
}

async function joinRoom(){
  if(!uid){
    statusEl.textContent = "Still connecting...";
    return;
  }

  const code = document.getElementById("joinCode")
    .value.trim().toUpperCase();

  if(!/^[A-Z0-9]{6}$/.test(code)){
    statusEl.textContent = "Enter a 6-character room code.";
    return;
  }

  try{
    const ref = db.ref("rooms/" + code);
    const snap = await ref.child("players").once("value");

    if(!snap.exists()){
      statusEl.textContent = "Room not found.";
      return;
    }

    if(snap.numChildren() >= 4){
      statusEl.textContent = "Room is full.";
      return;
    }

    await ref.child("players/" + uid).set({
      x:150,
      y:332,
      name:"Player",
      updatedAt:Date.now()
    });

    await enterRoom(code);
  }catch(error){
    statusEl.textContent = "Join failed: " + error.message;
  }
}

async function enterRoom(code){
  if(room) await leaveRoom();

  room = code;
  players = {};
  lastHits = {};

  me.x = uid ? 100 + Math.random()*100 : 100;
  me.y = 332;
  me.vx = 0;
  me.vy = 0;

  const ref = db.ref("rooms/" + code);
  playerRef = ref.child("players/" + uid);

  await playerRef.onDisconnect().remove();

  codeEl.textContent = code;
  statusEl.textContent = "Joined room " + code + "!";
  running = true;

  ref.child("players").on("value",snap=>{
    players = snap.val() || {};
    playersEl.textContent =
      "Players: " + Object.keys(players).length;
  });
}

async function leaveRoom(){
  if(!room) return;

  const oldRoom = room;
  const oldPlayerRef = playerRef;

  room = null;
  playerRef = null;
  players = {};
  running = false;

  if(oldPlayerRef){
    await oldPlayerRef.onDisconnect().cancel();
    await oldPlayerRef.remove();
  }

  db.ref("rooms/" + oldRoom + "/players").off();

  codeEl.textContent = "------";
  playersEl.textContent = "Players: 0";
  statusEl.textContent = "You left the room.";
}

document.getElementById("create").onclick = createRoom;
document.getElementById("join").onclick = joinRoom;
document.getElementById("exit").onclick = leaveRoom;
document.getElementById("play").onclick = ()=>running = true;

window.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()] = true;

  if([" ","ArrowUp","ArrowLeft","ArrowRight","ArrowDown"].includes(e.key)){
    e.preventDefault();
  }
});

window.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()] = false;
});

function collideWithPlayers(){
  for(const [id,p] of Object.entries(players)){
    if(id === uid || !p) continue;
    if(typeof p.x !== "number" || typeof p.y !== "number") continue;

    // Ignore players whose connection has gone stale.
    if(Date.now() - (p.updatedAt || 0) > 6000) continue;

    let dx = me.x - p.x;
    let dy = me.y - p.y;
    let distance = Math.sqrt(dx*dx + dy*dy);

    if(distance >= radius*2) continue;

    if(distance < 0.001){
      dx = uid > id ? 1 : -1;
      dy = 0;
      distance = 1;
    }

    const nx = dx / distance;
    const ny = dy / distance;
    const overlap = radius*2 - distance;

    // Separate the two circles.
    me.x += nx * overlap * 0.55;
    me.y += ny * overlap * 0.55;

    // Apply a knockback impulse with a short cooldown.
    if(Date.now() - (lastHits[id] || 0) > 400){
      lastHits[id] = Date.now();

      const impact = Math.max(
        5,
        Math.min(13,Math.abs(me.vx*nx + me.vy*ny) + 4)
      );

      me.vx += nx * impact * 1.1;
      me.vy += ny * impact * 1.1 - 1.5;
    }
  }
}

function update(){
  if(running){
    // Horizontal movement.
    if(keys.a || keys.arrowleft){
      me.vx -= 0.65;
    }

    if(keys.d || keys.arrowright){
      me.vx += 0.65;
    }

    me.vx = Math.max(-7.5,Math.min(7.5,me.vx));

    const jumpPressed =
      keys.w || keys[" "] || keys.arrowup;

    if(jumpPressed && grounded && !jumpHeld){
      me.vy = -11;
      grounded = false;
    }

    jumpHeld = jumpPressed;

    // Gravity.
    me.vy += 0.48;

    const oldY = me.y;

    me.x += me.vx;
    me.y += me.vy;

    // Arena walls.
    if(me.x < radius){
      me.x = radius;
      me.vx = Math.abs(me.vx)*0.65;
    }

    if(me.x > 700-radius){
      me.x = 700-radius;
      me.vx = -Math.abs(me.vx)*0.65;
    }

    // Platform landing.
    grounded = false;

    for(const p of platforms){
      const overlapsX =
        me.x + radius > p.x &&
        me.x - radius < p.x + p.w;

      const crossedTop =
        oldY + radius <= p.y &&
        me.y + radius >= p.y;

      if(me.vy >= 0 && overlapsX && crossedTop){
        me.y = p.y - radius;
        me.vy = 0;
        grounded = true;
      }
    }

    // Main floor.
    if(me.y + radius >= 350){
      me.y = 350-radius;
      me.vy = 0;
      grounded = true;
    }

    // Ceiling.
    if(me.y < radius){
      me.y = radius;
      me.vy = Math.abs(me.vy)*0.5;
    }

    // Player-to-player collisions.
    collideWithPlayers();

    // Friction.
    me.vx *= grounded ? 0.82 : 0.985;

    // Send our position to Firebase.
    if(room && playerRef && Date.now()-lastSent > 100){
      lastSent = Date.now();

      playerRef.update({
        x:me.x,
        y:me.y,
        updatedAt:Date.now()
      }).catch(error=>{
        statusEl.textContent = "Update failed: " + error.message;
      });
    }
  }

  draw();
  requestAnimationFrame(update);
}

function drawBall(x,y,color,label){
  ctx.beginPath();
  ctx.arc(x,y,radius,0,Math.PI*2);
  ctx.fillStyle = color;
  ctx.fill();

  ctx.lineWidth = 3;
  ctx.strokeStyle = "rgba(0,0,0,0.18)";
  ctx.stroke();

  ctx.fillStyle = "#172033";
  ctx.font = "12px Arial";
  ctx.textAlign = "center";
  ctx.fillText(label,x,y-27);
}

function draw(){
  ctx.clearRect(0,0,700,400);

  // Floor.
  ctx.fillStyle = "#53647d";
  ctx.fillRect(0,350,700,50);

  // Platforms.
  for(const p of platforms){
    ctx.fillStyle = "#55e5a0";
    ctx.fillRect(p.x,p.y,p.w,p.h);
  }

  // Other players.
  for(const [id,p] of Object.entries(players)){
    if(id === uid || !p) continue;

    if(typeof p.x !== "number" || typeof p.y !== "number") continue;

    if(Date.now() - (p.updatedAt || 0) > 6000) continue;

    drawBall(p.x,p.y,"#3478db","Friend");
  }

  // Our locally controlled player.
  drawBall(me.x,me.y,"#ff595e","You");
}

update();
</script>
</body>
</html>
