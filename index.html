
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bouncy Arena</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101522;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:20px;border-bottom:1px solid #293449;font-size:25px;font-weight:900}
header span{color:#55e5a0}
main{max-width:850px;margin:35px auto;padding:15px}
.panel{background:#192337;padding:22px;border-radius:15px;margin-bottom:20px}
input,button{padding:12px;border:0;border-radius:8px;font-size:16px;margin:5px}
input{width:170px}
button{background:#55e5a0;color:#102019;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.1)}
#arena{height:350px;background:#202e45;border:3px solid #40516c;border-radius:14px;position:relative;overflow:hidden}
.player{width:48px;height:48px;border-radius:50%;position:absolute;transition:left .06s,top .06s}
#p1{background:#55e5a0}
#p2{background:#ffbd59}
#message{font-size:30px;font-weight:900;color:#55e5a0;margin:15px}
#status{color:#aebbd0}
#controls{color:#bdc9dc;line-height:1.8}
</style>
</head>
<body>
<header>BOUNCY <span>ARENA</span></header>
<main>
<div class="panel">
<h2>Multiplayer Arena</h2>
<input id="room" placeholder="Room code" maxlength="6">
<br>
<button id="create">Create Room</button>
<button id="join">Join Room</button>
<p id="status">Connect to play with a friend.</p>
</div>

<div id="arena">
<div class="player" id="p1"></div>
<div class="player" id="p2"></div>
</div>
<div id="message">READY?</div>
<div id="controls">
WASD or Arrow Keys = Move<br>
SPACE = BONK!
</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey:"AIzaSyA7mmK1Ljk2As5dPCfNAvt9CvF17G6maOE",
 authDomain:"bouncyballarena-70cf9.firebaseapp.com",
 databaseURL:"https://bouncyballarena-70cf9-default-rtdb.firebaseio.com",
 projectId:"bouncyballarena-70cf9",
 storageBucket:"bouncyballarena-70cf9.firebasestorage.app",
 messagingSenderId:"1007913424936",
 appId:"1:1007913424936:web:8ed5bde9eb78692834bd1d",
 measurementId:"G-9Y8FXKXEK6"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();

let uid=null;
let roomCode=null;
let roomRef=null;
let myPlayer=null;
let players={};
let x=50,y=140;
let keys={};
let lastBonk=0;
let eventListener=null;

const status=document.getElementById("status");
const message=document.getElementById("message");

const arena=document.getElementById("arena");

function setStatus(t){status.textContent=t}

auth.signInAnonymously().then(result=>{
 uid=result.user.uid;
 setStatus("Connected! Create or join a room.");
}).catch(error=>{
 setStatus("Firebase error: "+error.message);
});

function draw(){
 const width=arena.clientWidth;
 const height=arena.clientHeight;

 for(const id of Object.keys(players)){
  const p=players[id];
  const el=document.getElementById(id===uid?"p1":"p2");
  if(!el)continue;
  el.style.left=(p.x/100*(width-48))+"px";
  el.style.top=(p.y/100*(height-48))+"px";
 }
}

async function enterRoom(code,create){
 if(!uid){setStatus("Connecting to Firebase...");return}

 code=code.toUpperCase().replace(/[^A-Z0-9]/g,"");
 if(code.length<4){setStatus("Enter a valid room code.");return}

 const ref=db.ref("rooms/"+code);
 const snapshot=await ref.once("value");

 if(create){
  if(snapshot.exists()){
   setStatus("Room already exists. Try another code.");
   return;
  }
 await ref.set({
 host: uid,
 createdAt: Date.now()
});
 }else if(!snapshot.exists()){
  setStatus("Room not found. Check the code.");
  return;
 }

 roomCode=code;
 roomRef=ref;
 const existing=await ref.child("players").once("value");
 const data=existing.val()||{};
 const count=Object.keys(data).length;

 if(count>=2&&!data[uid]){
  roomCode=null;
  roomRef=null;
  setStatus("Room is full!");
  return;
 }

 myPlayer=uid;
 x=count===0?20:80;
 y=50;

 await ref.child("players/"+uid).set({
  x,y,updated:Date.now()
 });

 ref.child("players/"+uid).onDisconnect().remove();

 ref.child("players").on("value",snap=>{
  players=snap.val()||{};
  draw();
 });

 const events=ref.child("bonks");
 eventListener=snap=>{
  const event=snap.val();
  if(!event||event.from===uid)return;
  message.textContent="BONK!!";
  message.style.color="#ffbd59";
  setTimeout(()=>message.textContent="FIGHT!",800);
 };
 events.limitToLast(1).on("child_added",eventListener);

 document.getElementById("room").value=code;
 setStatus("Connected to room "+code+"! Share this code with your friend.");
 message.textContent="FIGHT!";
}

document.getElementById("create").onclick=()=>{
 const code=Math.random().toString(36).substring(2,8).toUpperCase();
 document.getElementById("room").value=code;
 enterRoom(code,true);
};

document.getElementById("join").onclick=()=>{
 enterRoom(document.getElementById("room").value,false);
};

document.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(e.key.toLowerCase()))e.preventDefault();
 if(e.code==="Space")bonk();
});

document.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

function bonk(){
 if(!roomRef||Date.now()-lastBonk<800)return;
 lastBonk=Date.now();

 roomRef.child("bonks").push({
  from:uid,
  time:firebase.database.ServerValue.TIMESTAMP
 });

 message.textContent="BONK!!";
 message.style.color="#55e5a0";
 setTimeout(()=>message.textContent="FIGHT!",800);
}

function move(){
 if(!roomRef)return;

 let dx=0,dy=0;
 if(keys["a"]||keys["arrowleft"])dx--;
 if(keys["d"]||keys["arrowright"])dx++;
 if(keys["w"]||keys["arrowup"])dy--;
 if(keys["s"]||keys["arrowdown"])dy++;

 if(dx||dy){
  x=Math.max(0,Math.min(100,x+dx*0.8));
  y=Math.max(0,Math.min(100,y+dy*0.8));

  roomRef.child("players/"+uid).update({
   x,y,updated:Date.now()
  });
  players[uid]={x,y};
  draw();
 }
}

setInterval(move,30);
window.addEventListener("resize",draw);
</script>
</body>
</html>
